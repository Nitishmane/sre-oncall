# Memory caps are deliberate, and 1500m is chosen, not arbitrary. These servers grow steadily under load — notion
# went from 80 MB to 1.8 GB inside an hour — and Docker Desktop only has 7.6 GB
# here, shared with the kind node. Left uncapped they starved the Kubernetes API
# server until it answered `TLS handshake timeout`, which fired every alert at
# once, which started more sessions, which used more memory. A capped server is
# restarted by Docker; a starved cluster takes the whole demo down.
#
# 768m was too tight: argocd reached 94% of it and the containers restarted
# mid-investigation, which surfaces to the agent as `MCP error -32001: Request
# timed out` and loses the session. 1500m x5 leaves roughly half the Docker
# allocation for the kind node. These servers still grow, so restart the stack
# between demo runs rather than relying on the cap to be hit.
# Local stdio → streamable-HTTP bridges for the MCP servers TrueForge can only
# reach over a URL. See mcp/README.md.
#
#   docker compose -f mcp/compose.yaml --env-file ../.env up -d
#
# Everything binds to 127.0.0.1: these processes hold cluster and SaaS
# credentials and must not be reachable from outside this machine.

name: sre-oncall-mcp

# Ports 8100-8104. Deliberately clear of 8000, which the kind cluster maps to
# the demo service, and of 8080, which the orchestrator uses.

services:
  mcp-grafana:
    image: mcp/grafana:latest
    mem_limit: 1500m
    command: ["-t", "streamable-http", "--address", "0.0.0.0:8100"]
    environment:
      # NOT ${GRAFANA_URL}: that is the host-side URL used by the setup scripts
      # and Terraform. From inside a container, `localhost` is the container.
      GRAFANA_URL: ${MCP_GRAFANA_UPSTREAM_URL:-http://host.docker.internal:3000}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_TOKEN:?set GRAFANA_TOKEN in .env}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8100:8100"]
    restart: unless-stopped

  mcp-kubernetes:
    image: node:22-alpine
    mem_limit: 1500m
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y kubernetes-mcp-server@latest --kubeconfig /kube/config"
      - --outputTransport
      - streamableHttp
      - --port
      - "8101"
    volumes:
      # Read-only. kind writes a kubeconfig whose server is 127.0.0.1:<port>,
      # which means nothing inside a container — bootstrap-mcp.sh rewrites it to
      # the node's container address before mounting.
      - ${KUBECONFIG_PATH:-./.kube-config-container}:/kube/config:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8101:8101"]
    restart: unless-stopped

  mcp-argocd:
    image: node:22-alpine
    mem_limit: 1500m
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y argocd-mcp@latest stdio"
      - --outputTransport
      - streamableHttp
      - --port
      - "8102"
    environment:
      ARGOCD_BASE_URL: ${MCP_ARGOCD_UPSTREAM_URL:-https://host.docker.internal:8443}
      ARGOCD_API_TOKEN: ${ARGOCD_API_TOKEN}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"  # kind's ArgoCD serves a self-signed cert
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8102:8102"]
    restart: unless-stopped

  # No bridge needed: this server speaks streamable HTTP itself. Wrapping it in
  # supergateway meant nesting `docker run` inside a container that has no docker
  # CLI, which failed with EPIPE the moment a request arrived.
  mcp-terraform:
    image: hashicorp/terraform-mcp-server:latest
    mem_limit: 1500m
    command: ["streamable-http", "--transport-port", "8103", "--transport-host", "0.0.0.0"]
    ports: ["127.0.0.1:8103:8103"]
    restart: unless-stopped

  mcp-notion:
    image: node:22-alpine
    mem_limit: 1500m
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y @notionhq/notion-mcp-server"
      - --outputTransport
      - streamableHttp
      - --port
      - "8104"
    environment:
      # Internal integration token, shared to the Postmortems database only.
      NOTION_TOKEN: ${NOTION_TOKEN}
    ports: ["127.0.0.1:8104:8104"]
    restart: unless-stopped
