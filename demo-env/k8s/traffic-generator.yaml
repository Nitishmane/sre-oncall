# A synthetic user: constant, boring traffic against the demo service.
#
# The error-rate alert is a ratio (5xx / total). With no traffic the denominator
# is zero, the alert can never fire, and the "all green" opening shot of the demo
# has nothing to show. Five requests a second is enough for a 2-minute rate
# window to react within seconds of a fault being injected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: traffic-generator }
  template:
    metadata:
      labels: { app: traffic-generator }
    spec:
      containers:
        - name: traffic-generator
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                curl -s -o /dev/null http://demo-service.demo.svc.cluster.local:8000/checkout
                sleep 0.2
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
