# The demo service as an ArgoCD Application.
#
# This is what makes "what changed?" answerable: a fault injection is a commit
# plus a sync, so the agent can find it in ArgoCD's deploy history and correlate
# it with the alert's start time — and roll it back through the ArgoCD MCP,
# behind an approval gate.
#
# `repoURL` is filled in by scripts/wire-argocd.sh from the repository's own
# git remote, so this file carries no account-specific value.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: REPO_URL_PLACEHOLDER
    targetRevision: main
    path: demo-env/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    # Deliberately NOT automated: the demo needs a human (or the agent, behind a
    # gate) to trigger syncs, and auto-sync would silently revert a rollback.
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 1m }
